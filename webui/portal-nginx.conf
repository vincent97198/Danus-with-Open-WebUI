server {
    listen 80;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/portal\.(css|js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /control {
        proxy_pass http://local-llm-webui:7860/;
    }

    location /dashboard/ {
        proxy_pass http://local-llm-webui:7860;
    }

    location /api/ {
        proxy_pass http://local-llm-webui:7860;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /static/ {
        proxy_pass http://local-llm-webui:7860;
    }
}
